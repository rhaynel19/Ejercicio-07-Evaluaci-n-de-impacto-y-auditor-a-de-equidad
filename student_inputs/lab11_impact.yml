purpose: "Ejercicio académico para evaluar si un DSS con datos sintéticos puede priorizar casos para revisión humana; no es una herramienta operativa."
assisted_decision: "Orden de revisión de casos sintéticos; una persona conserva la decisión y puede ignorar la puntuación."
users: "Estudiante y equipo académico que ejecuta el laboratorio; operador hipotético de revisión usado solo para analizar el diseño."
affected_population: "No hay personas afectadas en los datos del ejercicio: el dataset es sintético. En un eventual sistema real, serían las personas asociadas con los casos territoriales y sus comunidades; no se ha realizado consulta con ellas."
owner: "Responsable académico del expediente: Edwin Ramón José Nolasco. No existe un propietario institucional u operativo designado."
non_predictive_alternative: "Revisión manual con criterios transparentes, sin puntuación ni ordenamiento del modelo; es la línea base segura si los controles no pasan."
out_of_scope_use: "Intervención automática, decisión de elegibilidad, declaración de emergencia, perfilamiento de población real o uso con datos reales."
withdrawal_condition: "Suspender cualquier uso asistido si falla una puerta configurada, se detecta deriva o daño, no puede verificarse la procedencia/calidad de datos, o se intenta usar fuera del propósito. No reanudar sin análisis, controles probados y aprobación de un propietario institucional."
appeal_mechanism: "No aplica a personas reales en el ejercicio sintético. Para una propuesta real se requiere, antes de usarla, un canal accesible para solicitar explicación, corrección y revisión humana independiente; el responsable y los plazos deben ser aprobados por la institución."
