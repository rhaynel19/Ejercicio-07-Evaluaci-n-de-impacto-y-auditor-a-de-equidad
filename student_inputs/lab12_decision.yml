priority_harm: "Falsos negativos: casos relevantes que no se priorizan. Esta prioridad fue elegida por el autor del expediente."
primary_metric: "Recall global y por grupo protegido; revisar conjuntamente la brecha de recall y la tasa de falsos positivos (FPR) para evitar ocultar trade-offs."
tolerance: "Usar las puertas ya configuradas, sin ajustarlas a posteriori: recall >= 0.68; brecha entre grupos de recall <= 0.16; brecha entre grupos de FPR <= 0.16. Son umbrales didácticos del proyecto, no estándares legales ni una aceptación de riesgo real."
evidence: "reports/lab12/logistic/global_metrics.json; reports/lab12/logistic/fairness_by_group.csv; reports/lab12/logistic/fairness_intersectional.csv; reports/lab12/tree/global_metrics.json; reports/lab12/tree/fairness_by_group.csv; reports/lab12/tree/fairness_intersectional.csv; reports/lab13/deployment_decision.json."
limitation: "Prueba temporal sintética de 160 filas; intersecciones pequeñas (mínimo n=8); no hay intervalos de confianza, validación externa, consulta a afectados ni demostración de validez en una población real."
recommendation: "Modificar y limitar a priorización de casos sintéticos para revisión humana dentro del ejercicio. No desplegar ni usar con personas o datos reales; conservar revisión manual sin modelo como alternativa segura."
